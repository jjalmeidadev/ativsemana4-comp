<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rush Odyssey</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src = "initialscreen.js"></script>
    <script src="rushodyssey.js"></script>
    <style> body {display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;}</style>
  </head>

  <body>
    <script>
      // Variáveis globais para o jogador, teclado, cenário e pontuação
        var player;
        var teclado;
        var terra;
        var terra2;
        var terra3;
        var chao;
        var monstro;
        var placar;
        
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,

        // Configuração da física do jogo
        physics: {
          default: "arcade",
          arcade: { gravity: { y: 300 } },
        },

         parent: "game",
      dom: {
        createContainer: true,
      },
      scene: [InitialScreen, RushOdyssey]
    };

      const game = new Phaser.Game(config);
      game.scene.start('InitialScreen');
      </script>
  </body>
</html>
